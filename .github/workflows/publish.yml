name: Publish

# Publishing is manual for now: the Marketplace answers 401 to the OIDC token
# exchange for the publisher, so every run on main fails at the last step.
# Run it from the Actions tab. Once the Marketplace trusts this repository, or a
# token is stored as a secret, restore the trigger:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - run: npx @vscode/vsce publish --oidc --skip-duplicate
